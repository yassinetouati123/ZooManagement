<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Zoo Management banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7b733"/>
      <stop offset="1" stop-color="#fc4a1a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <circle cx="1060" cy="60" r="150" fill="#ffffff" opacity="0.04"/>
  <circle cx="1130" cy="270" r="110" fill="#ffffff" opacity="0.05"/>
  <circle cx="90" cy="300" r="120" fill="#ffffff" opacity="0.04"/>

  <!-- paw prints -->
  <g fill="#ffffff" opacity="0.10">
    <ellipse cx="960" cy="200" rx="34" ry="28"/>
    <circle cx="925" cy="160" r="12"/><circle cx="950" cy="148" r="12"/>
    <circle cx="976" cy="148" r="12"/><circle cx="1001" cy="160" r="12"/>
    <ellipse cx="1080" cy="120" rx="26" ry="21" transform="rotate(20 1080 120)"/>
    <circle cx="1054" cy="92" r="9"/><circle cx="1073" cy="83" r="9"/>
    <circle cx="1093" cy="83" r="9"/><circle cx="1111" cy="94" r="9"/>
  </g>

  <text x="70" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" letter-spacing="6" fill="#f7b733">ESPRIT  •  JAVA OOP</text>
  <text x="70" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="82" font-weight="700" fill="#ffffff">Zoo Management</text>
  <rect x="72" y="208" width="260" height="6" rx="3" fill="url(#accent)"/>
  <text x="70" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#d6e4ea">9 prosits  ·  1 evolving project  ·  from classes to generics</text>
  <text x="70" y="294" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#9fb8c4">by Yassine Touati  —  coached by Ghassen Klai</text>
</svg>
